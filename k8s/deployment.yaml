apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudeco-api
  labels:
    app.kubernetes.io/name: cloudeco-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudeco-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudeco-api
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudeco-api
      containers:
        - name: api
          image: australia-southeast1-docker.pkg.dev/cloudeco-devops/cloudeco-images/cloudeco-api:4a037e345cfb6e445d060e625a02124f405ecef9
          imagePullPolicy: IfNotPresent
          env:
            - name: YOLO_CONFIG_DIR
              value: /tmp/Ultralytics
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 3Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
