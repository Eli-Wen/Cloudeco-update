apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudeco-api
  labels:
    app.kubernetes.io/name: cloudeco-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudeco-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudeco-api
    spec:
      containers:
        - name: api
          image: cloudeco-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 3Gi
