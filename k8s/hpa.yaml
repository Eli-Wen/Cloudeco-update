apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudeco-api
  labels:
    app.kubernetes.io/name: cloudeco-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudeco-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
