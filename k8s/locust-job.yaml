apiVersion: batch/v1
kind: Job
metadata:
  name: cloudeco-locust
  labels:
    app.kubernetes.io/name: cloudeco-locust
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudeco-locust
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: australia-southeast1-docker.pkg.dev/cloudeco-devops/cloudeco-images/cloudeco-locust:d7c90bdbdc10d4f7af375442d89e7bee76592cd4
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDECO_TEST_IMAGE_DIR
              value: /test_assets
            - name: CLOUDECO_TEST_SCENARIO
              value: mixed
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --host=http://cloudeco-api:80
            - --users=60
            - --spawn-rate=10
            - --run-time=8m
            - --autostart
            - --autoquit=10
            - --web-port=8089
          ports:
            - name: web
              containerPort: 8089
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
