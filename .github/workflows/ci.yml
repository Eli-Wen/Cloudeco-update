name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-scan:
    name: Validate and scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python source
        run: python -m compileall -q app

      - name: Validate Kubernetes YAML
        run: |
          python -m pip install --disable-pip-version-check yamllint==1.37.1
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable}}' k8s

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: Build API image archive
        run: docker buildx build --output type=docker,dest=/tmp/cloudeco-api.tar .

      - name: Report HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/cloudeco-api.tar
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Block CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/cloudeco-api.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          skip-setup-trivy: true
